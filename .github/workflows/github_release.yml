name: Piterfy signed release
on:
  push:
    tags: ['v*-piterfy.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Connect and browser lyrics
        run: |
          python3 -m unittest discover -s connect/server -p test_connect.py
          node connect/web/lyrics-core.test.cjs
          node --check connect/web/lyrics.js
          node --check connect/web/connect.js
      - name: Restore release signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_GITHUB }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS_GITHUB }}
        run: |
          python3 - <<'PY'
          import os, pathlib, base64
          folder = pathlib.Path(".signing")
          folder.mkdir(exist_ok=True)
          key = folder / "piterfy-release.p12"
          key.write_bytes(base64.b64decode(os.environ["KEYSTORE"]))
          (folder / "keystore.properties").write_text(
              "storeFile=" + str(key.resolve()) + "\nstorePassword=" + os.environ["STORE_PASSWORD"]
              + "\nkeyAlias=" + os.environ["KEY_ALIAS"] + "\nkeyPassword=" + os.environ["KEY_PASSWORD"] + "\n")
          PY
      - name: Test, lint and build both variants
        run: |
          chmod +x gradlew
          ./gradlew --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3072m -Pkotlin.compiler.execution.strategy=in-process testTempusDebugUnitTest testDegoogledDebugUnitTest lintTempusRelease lintDegoogledRelease assembleTempusRelease assembleDegoogledRelease
      - name: Archive deobfuscation maps
        run: |
          mkdir -p release-maps
          gzip -c app/build/outputs/mapping/tempusRelease/mapping.txt > release-maps/tempus-mapping.txt.gz
          gzip -c app/build/outputs/mapping/degoogledRelease/mapping.txt > release-maps/degoogled-mapping.txt.gz
      - name: Publish verified release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/tempus/release/*.apk
            app/build/outputs/apk/degoogled/release/*.apk
            release-maps/*.gz

      - uses: actions/upload-artifact@v4
        with:
          name: piterfy-signed
          path: |
            app/build/outputs/apk/*/release/*.apk
            release-maps/*.gz
      - name: Remove private signing material
        if: always()
        run: rm -rf .signing
