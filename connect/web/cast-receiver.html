<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Piterfy TV</title>
  <link rel="stylesheet" href="cast-receiver.css?v=5">
  <script defer src="cast-library.js?v=3"></script>
  <script defer src="cast-receiver.js?v=5"></script>
</head>
<body data-state="idle">
  <audio id="cast-audio" class="castMediaElement" aria-hidden="true"></audio>
  <img id="backdrop" class="backdrop" hidden alt="" referrerpolicy="no-referrer">
  <main>
    <header><span class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20"/><path d="M10 18v4m5-8v12m5-16v20m5-16v12m5-8v4"/></svg> Piterfy</span><span class="badge">Google Cast</span></header>
    <section class="layout" aria-label="Teraz odtwarzane">
      <div class="cover"><span class="fallback" aria-hidden="true">♫</span><img id="cover" hidden alt="" referrerpolicy="no-referrer"></div>
      <div class="track">
        <p class="eyebrow" id="state" role="status">Gotowe do przesyłania</p>
        <h1 id="title">Piterfy na TV</h1>
        <p class="artist" id="artist">Wybierz utwór w aplikacji Piterfy.</p>
        <p class="album" id="album"></p>
        <div class="timeline" id="timeline" hidden>
          <progress id="progress" value="0" max="1" aria-label="Postęp odtwarzania"></progress>
          <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
        </div>
        <div class="controls" id="controls" role="group" aria-label="Sterowanie odtwarzaniem" hidden>
          <div class="transport-row" role="group" aria-label="Zmiana utworu i pauza">
            <button id="previous-track" type="button" aria-label="Poprzedni utwór"><span aria-hidden="true">⏮</span> Poprzedni</button>
            <button class="primary" id="play" type="button">Pauza</button>
            <button id="next-track" type="button" aria-label="Następny utwór">Następny <span aria-hidden="true">⏭</span></button>
          </div>
          <div id="seek-row" class="transport-row seek-row" role="group" aria-label="Przewijanie bieżącego utworu" hidden>
            <span aria-hidden="true">Przewijanie</span>
            <button id="rewind" type="button" aria-label="Cofnij o 15 sekund">−15 s</button>
            <button id="forward" type="button" aria-label="Przewiń o 15 sekund">+15 s</button>
          </div>
        </div>
      </div>
    </section>
    <section class="library" id="library" hidden aria-label="Biblioteka Piterfy">
      <header><h2 id="library-title"></h2><button id="library-back" type="button">Wróć</button></header>
      <p id="library-status" role="status"></p>
      <div id="library-content" class="library-content" tabindex="0"></div>
      <div class="library-pages" id="library-pages" hidden>
        <button id="library-prev" type="button">Poprzednia</button>
        <span id="library-page"></span>
        <button id="library-next" type="button">Następna</button>
      </div>
    </section>
    <nav class="library-nav" aria-label="Widoki odtwarzacza">
      <button type="button" data-view="lyrics" aria-controls="library" aria-expanded="false">Tekst utworu</button>
      <button type="button" data-view="queue" aria-controls="library" aria-expanded="false">Kolejka</button>
      <button type="button" data-view="playlists" aria-controls="library" aria-expanded="false">Playlisty</button>
    </nav>
    <footer id="hint">Strzałki wybierają przycisk. OK uruchamia akcję.</footer>
  </main>
</body>
</html>
